name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build plugin
        run: npm run build
        
      - name: Create release directory
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css README.md LICENSE release/
          
      - name: Zip release
        run: |
          cd release
          zip -r ../scoro-md-${{ github.ref_name }}.zip .
          cd ..
          
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            scoro-md-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true 